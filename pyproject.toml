[project]
name = "docile-benchmark"
version = "0.3.4"
description = "Tools to work with the DocILE dataset and benchmark"
readme = "README.md"
requires-python = ">=3.9,<3.13"
authors = [
    { name = "Stepan Simsa", email = "stepan.simsa@rossum.ai" },
    { name = "Matyas Skalicky", email = "matyas.skalicky@rossum.ai" },
    { name = "Milan Sulc", email = "milan.sulc@rossum.ai" },
    { name = "Michal Uricar", email = "michal.uricar@rossum.ai" },
    { name = "Matej Kocian", email = "matej.kocian@rossum.ai" },
    { name = "Yash Patel", email = "patelyas@fel.cvut.cz" },
]
dependencies = [
    "tqdm>=4.64.1,<5",
    "pdf2image>=1.16.0,<2",
    "pillow>=9.1.0",
    "networkx[default]>=2.8.8,<3",
    "tabulate>=0.9.0,<0.10",
    "click>=8.0.0,<9",
]

[project.urls]
homepage = "https://docile.rossum.ai/"
repository = "https://github.com/rossumai/docile"

[project.optional-dependencies]
interactive = [
    "jupyterlab>=3.5.0,<4",
    "ipywidgets>=8.0.4,<9",
    "plotly>=5.12.0,<6",
]
ocr = [
    "python-doctr>=0.6.0",
    "torch>=1.13.1",
    "torchvision>=0.14.1",
    "opencv-python>=4.6.0.66,<5",
]
baselines = [
    "torch>=1.13.1",
    "torchvision>=0.14.1",
    "transformers[torch]>=4.26.1",
    # pin datasets version to avoid https://github.com/apache/arrow/issues/34455
    "datasets[s3]>=2.8.0,<2.10.0",
    "torchmetrics>=0.11.0,<0.12",
    "sentencepiece>=0.1.97,<0.2",
    "tensorboard>=2.11.2,<3",
    "scikit-learn>=1.2.1,<2",
    "pytorch-lightning[extra]>=1.8.3,<2",
    "timm>=0.6.11,<0.7",
    # pin botocore otherwise the resolver never finishes
    "botocore>=1.34.69,<2",
    "aiobotocore>=2.12.3,<3",
]

[project.scripts]
docile_evaluate = "docile.cli.evaluate:evaluate"
docile_print_evaluation_report = "docile.cli.evaluate:print_evaluation_report"

[dependency-groups]
dev = [
    "pre-commit>=2.20.0,<3",
    "pytest>=7.2.0,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docile"]

[tool.black]
# NOTE: you have to use single-quoted strings in TOML for regular expressions.
# It's the equivalent of r-strings in Python.  Multiline strings are treated as
# verbose regular expressions by Black.  Use [ ] to denote a significant space
# character.
line-length = 99
target-version = ["py39", "py310", "py311"]
include = '\.py$'
exclude = '/(\.git|\.mypy_cache|__pycache__|\.pytest_cache|data|docs|)/'

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 99
ensure_newline_before_comments = true

[tool.pydocstyle]
convention = "numpy"
# D202 - not compatible with black
add_ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D202"]
match_dir = '^(?!\.).*\.py'

[tool.mypy]
pretty = true
show_error_codes = true
disallow_untyped_defs = true
warn_return_any = false
namespace_packages = true
ignore_missing_imports = true
disable_error_code = ["operator", "index", "var-annotated"]

[tool.codespell]
skip = "*.ipynb,tests/data/*"
# Using lower case for doubleClick: https://github.com/codespell-project/codespell/issues/2375
ignore-words-list = "doubleclick"
