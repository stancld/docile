[project]
name = "docile-benchmark"
version = "0.3.4"
description = "Tools to work with the DocILE dataset and benchmark"
readme = "README.md"
requires-python = ">=3.9,<3.13"
authors = [
    { name = "Stepan Simsa", email = "stepan.simsa@rossum.ai" },
    { name = "Matyas Skalicky", email = "matyas.skalicky@rossum.ai" },
    { name = "Milan Sulc", email = "milan.sulc@rossum.ai" },
    { name = "Michal Uricar", email = "michal.uricar@rossum.ai" },
    { name = "Matej Kocian", email = "matej.kocian@rossum.ai" },
    { name = "Yash Patel", email = "patelyas@fel.cvut.cz" },
]
# NOTE: the package still targets Python >=3.9, so several upper bounds below
# cap at the last release line that supports 3.9 (networkx <3.3, click <8.2, ...).
dependencies = [
    "tqdm>=4.66,<5",
    "pdf2image>=1.17,<2",
    "pillow>=10.0,<13",
    "networkx[default]>=3.0,<3.3",
    "tabulate>=0.9.0,<0.10",
    "click>=8.1,<8.2",
]

[project.urls]
homepage = "https://docile.rossum.ai/"
repository = "https://github.com/rossumai/docile"

[project.optional-dependencies]
interactive = [
    "jupyterlab>=4.0,<5",
    "ipywidgets>=8.0.4,<9",
    "plotly>=5.12,<7",
]
ocr = [
    # python-doctr >=0.11 and torch >=2.7 dropped Python 3.9
    "python-doctr>=0.6.0,<0.11",
    "torch>=1.13.1,<2.7",
    "torchvision>=0.14.1,<0.22",
    "opencv-python>=4.6.0.66,<5",
]
baselines = [
    # torch/torchvision capped to the last line that still supports Python 3.9
    "torch>=1.13.1,<2.7",
    "torchvision>=0.14.1,<0.22",
    # transformers 4.57+ / datasets 4+ dropped Python 3.9
    "transformers[torch]>=4.26.1,<4.57",
    # the old <2.10 pin worked around pyarrow#34455, long since fixed; cap <4 keeps 3.9
    "datasets[s3]>=2.10,<4",
    # torchmetrics 1.9 / scikit-learn 1.7 / pytorch-lightning 2.6 dropped Python 3.9
    "torchmetrics>=0.11,<1.9",
    "sentencepiece>=0.1.97,<0.3",
    "tensorboard>=2.11.2,<3",
    "scikit-learn>=1.2.1,<1.7",
    "pytorch-lightning[extra]>=1.8.3,<2.6",
    "timm>=0.6.11,<2",
    # botocore/aiobotocore capped to the last line supporting Python 3.9
    "botocore>=1.34.69,<1.38",
    "aiobotocore>=2.12.3,<2.23",
]

[project.scripts]
docile_evaluate = "docile.cli.evaluate:evaluate"
docile_print_evaluation_report = "docile.cli.evaluate:print_evaluation_report"

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5",
    # pytest 9 dropped Python 3.9
    "pytest>=8.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docile"]

[tool.black]
# NOTE: you have to use single-quoted strings in TOML for regular expressions.
# It's the equivalent of r-strings in Python.  Multiline strings are treated as
# verbose regular expressions by Black.  Use [ ] to denote a significant space
# character.
line-length = 99
target-version = ["py39", "py310", "py311"]
include = '\.py$'
exclude = '/(\.git|\.mypy_cache|__pycache__|\.pytest_cache|data|docs|)/'

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 99
ensure_newline_before_comments = true

[tool.pydocstyle]
convention = "numpy"
# D202 - not compatible with black
add_ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D202"]
match_dir = '^(?!\.).*\.py'

[tool.mypy]
pretty = true
show_error_codes = true
disallow_untyped_defs = true
warn_return_any = false
namespace_packages = true
ignore_missing_imports = true
disable_error_code = ["operator", "index", "var-annotated"]

[tool.codespell]
skip = "*.ipynb,tests/data/*"
# Using lower case for doubleClick: https://github.com/codespell-project/codespell/issues/2375
ignore-words-list = "doubleclick"
