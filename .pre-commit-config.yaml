repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-json
        # exclude: data/  # if the checks would be too slow, maybe also add to checks below
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        name: ruff
        args: [--fix]
        types: [python]
      - id: ruff-format
        name: ruff-format
        types: [python]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli==2.0.1

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        name: mypy
        additional_dependencies: [
          "importlib_resources>=6.0,<7",
          "more_itertools>=10.0,<12",
          "numpy>=2.1,<3",
          "pandas-stubs>=2.2,<4",
          "pytest-mock>=3.14,<4",
          "pytest-stub==1.1.0",
          "types-Pillow>=10.2,<11",
          "types-setuptools>=80.0",
          "types-tabulate>=0.9,<1"
        ]
        args: []
        language: python
        types: [python]
        exclude: |
          (?x)^(
              baselines/.*|
          )$
